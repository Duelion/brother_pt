[project]
name = "brother-pt-bluetooth"
version = "2.0.0"
description = "Python library for printing to Brother P-Touch label printers via Bluetooth"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["brother", "p-touch", "label", "printer", "bluetooth", "pt-p710bt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]

dependencies = [
    "pyserial>=3.5",
    "Pillow>=10.0.0",
    "packbits>=0.6",
    "qrcode>=7.4",
    "loguru>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brother_pt"]
